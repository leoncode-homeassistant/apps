name: Codex CLI
version: "0.1.1"
slug: codex_cli
description: Run Codex CLI as a secure SSH workspace on Home Assistant OS
url: "https://github.com/leoncode-homeassistant/apps/tree/main/codex-cli"
arch:
  - aarch64
  - amd64
init: false
startup: services
map:
  - homeassistant_config:rw
  - backup:rw
  - share:rw
options:
  authorized_keys: []
  ha_mcp_url: ""
  allow_tcp_forwarding: false
schema:
  authorized_keys:
    - str
  ha_mcp_url: str?
  allow_tcp_forwarding: bool
ports:
  22/tcp: 2222
ports_description:
  22/tcp: SSH access for Codex desktop
image: "ghcr.io/leoncode-homeassistant/codex-cli"
