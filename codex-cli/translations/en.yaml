configuration:
  authorized_keys:
    name: Authorized SSH keys
    description: Public SSH keys allowed to sign in. Password login is disabled.
  ha_mcp_url:
    name: HA-MCP URL
    description: Optional local Streamable HTTP URL provided by HA-MCP. Treat its private path as a credential.
  codex_provider:
    name: Codex model provider
    description: Use a custom OpenAI-compatible Responses provider or connect directly to OpenAI. Authentication is completed separately in Codex.
  codex_provider_name:
    name: Provider name
    description: Optional display name for the custom provider. Ignored when OpenAI is selected.
  codex_base_url:
    name: Provider base URL
    description: Optional custom Responses API URL. Ignored when OpenAI is selected.
  codex_model:
    name: Codex model
    description: Optional model identifier sent to the selected provider. Leave empty to use the Codex default.
  codex_api_key:
    name: Provider API key
    description: Optional masked API key. Leave empty to authenticate later through Codex desktop or the CLI.
  codex_approval_policy:
    name: Approval policy
    description: Choose when Codex asks for approval before running commands. Default leaves the decision to Codex.
  codex_sandbox_mode:
    name: Sandbox mode
    description: Limit filesystem and network access for commands. Full access applies only inside the isolated app container.
  codex_web_search:
    name: Web search
    description: Choose whether Codex disables search, uses cached or indexed results, or accesses the live web.
  codex_model_verbosity:
    name: Response detail
    description: Override the response verbosity for compatible Responses API models, or use the model default.
  codex_reasoning_summary:
    name: Reasoning summary
    description: Choose the detail level of reasoning summaries for supported models.
  codex_reasoning_effort:
    name: Reasoning effort
    description: Set the default reasoning effort for supported models, or leave model selection unchanged.
  codex_plugins_enabled:
    name: Allow plugins
    description: Leave installed Codex plugins available. Disabling this blocks plugins but does not uninstall them.
  allow_tcp_forwarding:
    name: Allow SSH TCP forwarding
    description: Allow authenticated SSH clients to forward TCP connections through this app.
network:
  22/tcp: SSH port
